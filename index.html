<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zone Royale</title>
<style>
html,body{margin:0;height:100%;background:#2d5a27;overflow:hidden;touch-action:none}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');
function resize(){c.width=innerWidth;c.height=innerHeight}
resize();addEventListener('resize',resize);
const player={x:1000,y:1000,r:16};
const joy={on:false,id:null,bx:0,by:0,dx:0,dy:0};
const R=60;
c.addEventListener('touchstart',e=>{for(const t of e.changedTouches){if(!joy.on&&t.clientX<innerWidth/2){joy.on=true;joy.id=t.identifier;joy.bx=t.clientX;joy.by=t.clientY;joy.dx=joy.dy=0}}});
c.addEventListener('touchmove',e=>{for(const t of e.changedTouches){if(t.identifier===joy.id){let x=t.clientX-joy.bx,y=t.clientY-joy.by;const d=Math.hypot(x,y);if(d>R){x=x/d*R;y=y/d*R}joy.dx=x/R;joy.dy=y/R}}});
function end(e){for(const t of e.changedTouches){if(t.identifier===joy.id){joy.on=false;joy.dx=joy.dy=0}}}
c.addEventListener('touchend',end);c.addEventListener('touchcancel',end);
function loop(){
 player.x+=joy.dx*4;player.y+=joy.dy*4;
 g.fillStyle='#2d5a27';g.fillRect(0,0,c.width,c.height);
 const cx=player.x-c.width/2,cy=player.y-c.height/2;
 g.strokeStyle='rgba(0,0,0,.12)';
 for(let x=-(cx%100);x<c.width;x+=100){g.beginPath();g.moveTo(x,0);g.lineTo(x,c.height);g.stroke()}
 for(let y=-(cy%100);y<c.height;y+=100){g.beginPath();g.moveTo(0,y);g.lineTo(c.width,y);g.stroke()}
 g.fillStyle='#f5c542';g.beginPath();g.arc(c.width/2,c.height/2,player.r,0,7);g.fill();
 if(joy.on){g.strokeStyle='#fff8';g.beginPath();g.arc(joy.bx,joy.by,R,0,7);g.stroke();g.fillStyle='#fff6';g.beginPath();g.arc(joy.bx+joy.dx*R,joy.by+joy.dy*R,25,0,7);g.fill()}
 requestAnimationFrame(loop)}
loop();
</script>
</body>
</html>
