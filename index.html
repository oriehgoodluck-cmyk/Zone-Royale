<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zone Royale</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none}
canvas{position:fixed;left:0;top:0}
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);
const u=document.createElement('canvas');
document.body.appendChild(u);
u.style.pointerEvents='none';
const g=u.getContext('2d');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9ec9e8);
scene.fog=new THREE.Fog(0x9ec9e8,40,180);
const cam=new THREE.PerspectiveCamera(60,1,0.1,400);
scene.add(new THREE.HemisphereLight(0xffffff,0x556b2f,0.9));
const sun=new THREE.DirectionalLight(0xffffff,0.8);
sun.position.set(50,80,30);scene.add(sun);
function mat(c){return new THREE.MeshLambertMaterial({color:c})}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1000,1000),mat(0x4a7a3a));
ground.rotation.x=-Math.PI/2;scene.add(ground);
let seed=7;
function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
for(let i=0;i<150;i++){
 const x=(rnd()-.5)*400,z=(rnd()-.5)*400;
 if(Math.hypot(x,z)<8)continue;
 if(rnd()<.6){
  const t=new THREE.Group();
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.3,.4,3),mat(0x5b3a1e));
  trunk.position.y=1.5;
  const top=new THREE.Mesh(new THREE.ConeGeometry(2,6,8),mat(0x1f4d2b));
  top.position.y=6;
  t.add(trunk,top);t.position.set(x,0,z);scene.add(t);
 }else{
  const s=1+rnd()*2;
  const r=new THREE.Mesh(new THREE.DodecahedronGeometry(s),mat(0x777777));
  r.position.set(x,s*.5,z);scene.add(r);
 }
}
const me=new THREE.Group();
const body=new THREE.Mesh(new THREE.BoxGeometry(.8,1.1,.45),mat(0x4b5a3a));body.position.y=1.3;
const head=new THREE.Mesh(new THREE.SphereGeometry(.25,12,12),mat(0xe0b08a));head.position.y=2.1;
const helmet=new THREE.Mesh(new THREE.SphereGeometry(.28,12,12,0,Math.PI*2,0,Math.PI/2),mat(0x2f3a25));helmet.position.y=2.15;
const legL=new THREE.Mesh(new THREE.BoxGeometry(.3,.8,.3),mat(0x333b2a));legL.position.set(-.2,.4,0);
const legR=legL.clone();legR.position.x=.2;
const gun=new THREE.Mesh(new THREE.BoxGeometry(.12,.15,1),mat(0x222222));gun.position.set(.35,1.4,.5);
me.add(body,head,helmet,legL,legR,gun);scene.add(me);
function resize(){
 renderer.setSize(innerWidth,innerHeight);
 cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();
 u.width=innerWidth;u.height=innerHeight}
resize();addEventListener('resize',resize);
const P={x:0,z:0,yaw:0,pitch:.35,face:0};
const joy={on:false,id:null,bx:0,by:0,dx:0,dy:0,sprint:false,moved:false,ldx:0,ldy:-1};
const auto={on:false,dx:0,dy:-1};
const look={id:null,x:0,y:0};
const R=60;
addEventListener('touchstart',e=>{for(const t of e.changedTouches){
 const x=t.clientX,y=t.clientY;
 if(x<innerWidth/2){
  if(!joy.on){joy.on=true;joy.id=t.identifier;joy.bx=x;joy.by=y;joy.dx=joy.dy=0;joy.sprint=false;joy.moved=false}
 }else if(look.id===null){look.id=t.identifier;look.x=x;look.y=y}
}});
addEventListener('touchmove',e=>{for(const t of e.changedTouches){
 if(t.identifier===joy.id){
  let x=t.clientX-joy.bx,y=t.clientY-joy.by;const d=Math.hypot(x,y);
  if(d>12)joy.moved=true;
  if(d>R*0.3){joy.ldx=x/d;joy.ldy=y/d}
  if(d>R*1.35)joy.sprint=true;
  if(d>R){x=x/d*R;y=y/d*R}
  joy.dx=x/R;joy.dy=y/R;
 }
 if(t.identifier===look.id){
  P.yaw-=(t.clientX-look.x)*.006;
  P.pitch=Math.max(.05,Math.min(1,P.pitch+(t.clientY-look.y)*.004));
  look.x=t.clientX;look.y=t.clientY;
 }
}});
function end(e){for(const t of e.changedTouches){
 if(t.identifier===joy.id){
  if(joy.sprint&&joy.moved){auto.on=true;auto.dx=joy.ldx;auto.dy=joy.ldy}
  else auto.on=false;
  joy.on=false;joy.dx=joy.dy=0;joy.sprint=false}
 if(t.identifier===look.id)look.id=null;
}}
addEventListener('touchend',end);addEventListener('touchcancel',end);
let last=performance.now();
function loop(now){
 const dt=Math.min((now-last)/1000,.05);last=now;
 let ix=0,iy=0,sp=false,move=false;
 const mag=Math.hypot(joy.dx,joy.dy);
 if(joy.on&&mag>.05){ix=joy.dx;iy=joy.dy;sp=joy.sprint;move=true}
 else if(auto.on){ix=auto.dx;iy=auto.dy;sp=true;move=true}
 if(move){
  const m=Math.hypot(ix,iy);
  const amt=sp?1:Math.min(1,m);
  const nx=ix/m,ny=iy/m;
  const fx=Math.sin(P.yaw),fz=Math.cos(P.yaw);
  const rx=-Math.cos(P.yaw),rz=Math.sin(P.yaw);
  const vx=fx*(-ny)+rx*nx,vz=fz*(-ny)+rz*nx;
  const spd=(sp?7:4)*amt;
  P.x+=vx*spd*dt;P.z+=vz*spd*dt;
  P.face=Math.atan2(vx,vz);
 }else{P.face=P.yaw}
 const w=move?Math.sin(now/1000*(sp?16:10))*.7:0;
 legL.rotation.x=w;legR.rotation.x=-w;
 me.position.set(P.x,0,P.z);me.rotation.y=P.face;
 const d=6;
 cam.position.set(P.x-Math.sin(P.yaw)*Math.cos(P.pitch)*d,1.8+Math.sin(P.pitch)*d,P.z-Math.cos(P.yaw)*Math.cos(P.pitch)*d);
 cam.lookAt(P.x,1.8,P.z);
 renderer.render(scene,cam);
 g.clearRect(0,0,u.width,u.height);
 if(joy.on){
  g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=2;
  g.beginPath();g.arc(joy.bx,joy.by,R,0,7);g.stroke();
  g.fillStyle='rgba(255,255,255,.4)';
  g.beginPath();g.arc(joy.bx+joy.dx*R,joy.by+joy.dy*R,25,0,7);g.fill();
  const ix2=joy.bx,iy2=joy.by-R-50;
  g.fillStyle=joy.sprint?'rgba(255,160,0,.9)':'rgba(255,255,255,.25)';
  g.beginPath();g.arc(ix2,iy2,26,0,7);g.fill();
  g.fillStyle='#fff';g.font='bold 11px sans-serif';g.textAlign='center';
  g.fillText('SPRINT',ix2,iy2+4);
 }
 if(auto.on&&!joy.on){
  g.fillStyle='rgba(255,160,0,.85)';g.fillRect(20,u.height-70,190,44);
  g.fillStyle='#fff';g.font='bold 14px sans-serif';g.textAlign='center';
  g.fillText('AUTO SPRINT',115,u.height-46);
  g.font='11px sans-serif';g.fillText('tap left side to stop',115,u.height-32);
 }
 if(innerHeight>innerWidth){
  g.fillStyle='rgba(0,0,0,.85)';g.fillRect(0,0,u.width,u.height);
  g.fillStyle='#fff';g.font='bold 22px sans-serif';g.textAlign='center';
  g.fillText('Rotate your phone sideways',u.width/2,u.height/2);
 }
 requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
